name: file_sharing
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  url_strategy: ^0.3.0
  hive_flutter: ^1.1.0
  firebase_core: ^3.15.1
  flutter_smart_dialog: ^4.9.8+8
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
  firebase_auth: ^5.6.2
  data_table_2: ^2.6.0
  file_picker: ^10.2.0
  syncfusion_flutter_pdfviewer: ^30.1.40
  file_saver: ^0.3.1
  url_launcher: ^6.3.2
  http: ^1.4.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: "^0.14.4"
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true



  assets:
    - assets/images/

  fonts:
      - family: OpenSans
        fonts:
          - asset: assets/fonts/OpenSans-Regular.ttf
          - asset: assets/fonts/OpenSans-Bold.ttf
          - asset: assets/fonts/OpenSans-Light.ttf
      - family: Raleway
        fonts:
          - asset: assets/fonts/Raleway-Bold.ttf
          - asset: assets/fonts/Raleway-Regular.ttf
          - asset: assets/fonts/Raleway-Light.ttf



flutter_native_splash:
    color: "#ffffff"
    image: assets/images/icon_t.png
    image_web: assets/images/icon_t.png
    android: true
    ios: true
    web: true
    android_12:
  #dart run flutter_native_splash:create

flutter_launcher_icons:
    android: "launcher_icon"
    ios: false
    image_path: "assets/images/icon_t.png"
    min_sdk_android: 21 # android min sdk min:16, default 21
    web:
      generate: true
      image_path: "assets/images/icon_t.png"
      background_color: "#hexcode"
      theme_color: "#hexcode"
  #    flutter pub run flutter_launcher_icons
flutter_assets:
  assets_path: assets/
  output_path: lib/constants/
  filename: assets.dart
  field_prefix: