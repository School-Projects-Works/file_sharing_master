# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
replication:
  connections:
    - type: postgresql
      uri: !env PS_POSTGRESQL_URI
      sslmode: disable

# The storage backend is PowerSync's own internal bucket-state, not app data — it
# needs to create/manage its own schema, which the read-only powersync_role (correct,
# least-privilege for replication) can't do. Confirmed locally: reusing powersync_role
# here fails with "permission denied for database postgres" on startup migrations.
storage:
  type: postgresql
  uri: !env PS_STORAGE_POSTGRESQL_URI
  sslmode: disable

port: 8080

sync_config:
  content: |
    config:
      edition: 3
    streams:
      user_profile:
        auto_subscribe: true
        queries:
          - SELECT * FROM profiles WHERE id = auth.user_id()

      directory:
        auto_subscribe: true
        queries:
          - SELECT id, full_name, email, role FROM profiles

      # Primary/source table left unaliased on purpose: aliasing it renames which
      # local table the row is considered to belong to (confirmed via a "the source
      # row is synced under its alias" warning), so files/file_versions/groups/
      # group_members rows would silently vanish from their real local tables.
      #
      # IMPORTANT: two SEPARATE streams that both join into the same target table
      # (e.g. an "owned_file_versions" stream joined via files.owner_id, plus a
      # "shared_with_me_versions" stream joined via file_shares.recipient_id) leak
      # data cross-user — confirmed by direct testing: a share recipient with no
      # ownership relationship to a file received the owner-only stream's data too,
      # while a fully unrelated third user correctly received neither. The two
      # streams' grants appear to get unioned by file_id rather than kept separate.
      # Fix: exactly one joined stream per target table, combining every access
      # path (owned OR shared) into a single query with OR across the join
      # conditions, matching the one safe joined-stream-per-table shape already
      # proven correct (files had only one joined stream, shared_with_me_files,
      # and did not leak).
      accessible_files:
        auto_subscribe: true
        queries:
          - SELECT * FROM files WHERE owner_id = auth.user_id()
          - SELECT files.* FROM files JOIN file_shares fs ON fs.file_id = files.id WHERE fs.recipient_id = auth.user_id()

      accessible_file_versions:
        auto_subscribe: true
        queries:
          - SELECT file_versions.* FROM file_versions JOIN files ON files.id = file_versions.file_id WHERE files.owner_id = auth.user_id()
          - SELECT file_versions.* FROM file_versions JOIN files ON files.id = file_versions.file_id JOIN file_shares fs ON fs.file_id = files.id WHERE fs.recipient_id = auth.user_id()

      my_file_shares:
        auto_subscribe: true
        queries:
          - SELECT * FROM file_shares WHERE recipient_id = auth.user_id()
          - SELECT * FROM file_shares WHERE shared_by = auth.user_id()

      my_group_memberships:
        auto_subscribe: true
        queries:
          - SELECT * FROM group_members WHERE member_id = auth.user_id()
          - SELECT groups.* FROM groups JOIN group_members gm ON gm.group_id = groups.id WHERE gm.member_id = auth.user_id()

      groups_i_manage:
        auto_subscribe: true
        queries:
          - SELECT * FROM groups WHERE created_by = auth.user_id()
          - SELECT group_members.* FROM group_members JOIN groups g ON g.id = group_members.group_id WHERE g.created_by = auth.user_id()

      my_notifications:
        auto_subscribe: true
        queries:
          - SELECT * FROM notifications WHERE recipient_id = auth.user_id()

      # EXISTS(...) is not supported by the sync-rules SQL subset ("Unknown function"
      # fatal error, confirmed) — auth.user_id() IN (subquery) is, and is equivalent
      # here since profiles.id is unique.
      admin_all:
        auto_subscribe: true
        queries:
          - SELECT * FROM files WHERE auth.user_id() IN (SELECT id FROM profiles WHERE role = 'admin' AND status = 'active')
          - SELECT * FROM file_versions WHERE auth.user_id() IN (SELECT id FROM profiles WHERE role = 'admin' AND status = 'active')
          - SELECT * FROM file_shares WHERE auth.user_id() IN (SELECT id FROM profiles WHERE role = 'admin' AND status = 'active')
          - SELECT * FROM profiles WHERE auth.user_id() IN (SELECT id FROM profiles WHERE role = 'admin' AND status = 'active')
          - SELECT * FROM groups WHERE auth.user_id() IN (SELECT id FROM profiles WHERE role = 'admin' AND status = 'active')
          - SELECT * FROM group_members WHERE auth.user_id() IN (SELECT id FROM profiles WHERE role = 'admin' AND status = 'active')
          - SELECT * FROM notifications WHERE auth.user_id() IN (SELECT id FROM profiles WHERE role = 'admin' AND status = 'active')

client_auth:
  supabase: true
  # HS256 shared-secret validation (legacy Supabase JWT signing).
  supabase_jwt_secret: !env PS_SUPABASE_JWT_SECRET
  # Asymmetric (ES256) validation for Supabase's new JWT signing keys.
  # Points at the Supabase Auth JWKS endpoint; PowerSync selects the key by KID.
  jwks_uri: !env PS_SUPABASE_JWKS_URI
  # Supabase issues user tokens with the "authenticated" audience.
  audience:
    - authenticated

telemetry:
  prometheus_port: 9090
  disable_telemetry_sharing: true

api:
  tokens:
    - !env PS_API_TOKEN
