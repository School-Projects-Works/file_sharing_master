# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
replication:
  connections:
    - type: postgresql
      uri: !env PS_POSTGRESQL_URI
      sslmode: disable

# The storage backend is PowerSync's own internal bucket-state, not app data — it
# needs to create/manage its own schema, which the read-only powersync_role (correct,
# least-privilege for replication) can't do. Confirmed locally: reusing powersync_role
# here fails with "permission denied for database postgres" on startup migrations.
storage:
  type: postgresql
  uri: !env PS_STORAGE_POSTGRESQL_URI
  sslmode: disable

port: 8080

sync_config:
  content: |
    config:
      edition: 3
    streams:
      # Phase 2 scope only (profile + directory + own files). shared_with_me,
      # group streams, notifications, and admin_all are added in later phases
      # alongside the features that need them.
      user_profile:
        auto_subscribe: true
        queries:
          - SELECT * FROM profiles WHERE id = auth.user_id()

      directory:
        auto_subscribe: true
        queries:
          - SELECT id, full_name, email, role FROM profiles

      owned_files:
        auto_subscribe: true
        queries:
          - SELECT * FROM files WHERE owner_id = auth.user_id()

client_auth:
  supabase: true
  # HS256 shared-secret validation (legacy Supabase JWT signing).
  supabase_jwt_secret: !env PS_SUPABASE_JWT_SECRET
  # Asymmetric (ES256) validation for Supabase's new JWT signing keys.
  # Points at the Supabase Auth JWKS endpoint; PowerSync selects the key by KID.
  jwks_uri: !env PS_SUPABASE_JWKS_URI
  # Supabase issues user tokens with the "authenticated" audience.
  audience:
    - authenticated

telemetry:
  prometheus_port: 9090
  disable_telemetry_sharing: true

api:
  tokens:
    - !env PS_API_TOKEN
